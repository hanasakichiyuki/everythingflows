# 万物流转 · Nginx 站点配置
#
# 安装：
#   sudo cp deploy/nginx/flows.conf /etc/nginx/conf.d/flows.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 主域名策略：统一收敛到 apex（flows.xin），www 做 301。
# 与 site.config.json 的 url 及 Next 的 metadataBase 保持一致，避免 canonical / sitemap 分裂。
#
# 【首次部署的引导顺序，别搞反】
#   1. 先只启用下面的 80 端口 server 块，把两个 443 块整段注释掉，reload。
#      原因：443 块引用 /etc/nginx/certs/flows.xin.pem，证书还没签发时
#      这个文件不存在，nginx -t 会直接失败，reload 也进不去。
#   2. 用 webroot 模式签发证书（challenge 走上面 80 块的 ACME location）。
#   3. 取消 443 块的注释，nginx -t && systemctl reload nginx。
#
#   若跳过第 1 步硬上，拿到的报错是
#   nginx: [emerg] cannot load certificate ... No such file or directory

# ---------- HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name flows.xin www.flows.xin;

    # ACME http-01 校验必须能走明文 80。
    #
    # 注意这里为什么把 301 放进 location / 而不是写在 server 级：
    # server 级的 return 在 server-rewrite 阶段执行，早于 location 匹配，
    # 会把 /.well-known/acme-challenge/ 一起 301 掉；而首次签发时 443 还没有
    # 证书，校验方跟过去只会握手失败，于是 acme.sh 报「验证超时」。
    # 放进 location / 之后，只有非 ACME 路径才会被跳转。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://flows.xin$request_uri;
    }
}

# ---------- www -> apex ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.flows.xin;

    ssl_certificate     /etc/nginx/certs/flows.xin.pem;
    ssl_certificate_key /etc/nginx/certs/flows.xin.key;

    return 301 https://flows.xin$request_uri;
}

# ---------- 主站 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flows.xin;

    ssl_certificate     /etc/nginx/certs/flows.xin.pem;
    ssl_certificate_key /etc/nginx/certs/flows.xin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # 编辑器上传图片上限 5MB，留出余量；Nginx 默认只有 1m，不改会先被拦下
    client_max_body_size 10m;

    access_log /var/log/nginx/flows.access.log;
    error_log  /var/log/nginx/flows.error.log warn;

    # ---- 压缩 ----
    # 重要：next.config.mjs 里已设 compress: false，压缩完全由这里负责。
    # 不要再在 Next 侧开启，否则两边重复压缩、白耗 2 核 CPU。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # gzip_proxied 保持默认 off：代理响应已由 Nginx 按上面的规则压缩，无需二次处理

    # ---- Next 静态资源：内容哈希命名，可长缓存 ----
    location /_next/static/ {
        # 若装了 ngx_http_gzip_static_module，可开启以直接吐预压缩文件：
        # gzip_static on;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # 不要同时写 expires，否则会输出两个 Cache-Control 头
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 上传的图片同样走 Next 的代理，给一个中间缓存
    location /api/post-image {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-vercel-forwarded-for $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 【不要加 X-Forwarded-Proto】
        # Next 16 standalone 构造中间件的 rewrite 目标时，用的是「内部地址 + 转发协议」，
        # 即 `https://localhost:3000/zh`。一旦协议是 https，这个 URL 就和实际监听的
        # 明文 http://localhost:3000 不同源，Next 会当成外部代理去 fetch，对明文端口做
        # TLS 握手 → `write EPROTO ... wrong version number` → 全站 500。
        # 症状：https 下首页直接 500，而 http://127.0.0.1:3000 直连正常。
        # 应用侧不依赖该头（next-intl 的 locale 重写、登录跳转都是相对路径），
        # 对外链接一律用 NEXT_PUBLIC_SITE_URL，故这里刻意不传。
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # ============================================================
        # 【关键，删掉会让匿名 AI 对话全部 503】
        # src/app/api/chat/route.ts 的 clientIp() 只读取这一个请求头
        # （它原本是 Vercel 平台覆盖写入的）。这里必须补上。
        #
        # 必须用 $remote_addr，不能用 $proxy_add_x_forwarded_for ——
        # 后者会带上客户端自己伪造的值，等于把限流绕过送给对方。
        # ============================================================
        proxy_set_header x-vercel-forwarded-for $remote_addr;

        # ---- SSE 流式聊天：关闭缓冲、放宽超时 ----
        # /api/chat 是流式响应，Nginx 默认缓冲会导致回答卡住或一次性吐出
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 不要改写上游的 401/404 等语义
        proxy_intercept_errors off;
    }
}
